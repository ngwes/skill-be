name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  test:
    # Child processes, kills and paths differ between POSIX and Windows. engines.node is >=20, so
    # the oldest supported Node runs too, once: the code under test is the same on both systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
